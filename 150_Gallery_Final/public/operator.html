<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator Panel</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-slate-100">
    <div class="mx-auto max-w-[1800px] p-4">
      <div class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-wide">Gallery Composer Operator Panel</h1>
        <div class="flex items-center gap-3">
          <button id="open-config-modal" class="btn-ghost">Settings</button>
          <div class="text-xs text-slate-400">
            Local server: <span id="server-health">connecting...</span>
          </div>
        </div>
      </div>
      <div id="tool-warning" class="mb-3 hidden rounded border border-amber-400/50 bg-amber-900/30 p-2 text-sm text-amber-200"></div>

      <div class="grid grid-cols-12 gap-4">
        <section class="panel col-span-12 p-4">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="text-lg font-semibold">Queue</h2>
            <div class="text-xs text-slate-400">Max 12 jobs, 5 per page</div>
          </div>
          <div class="mb-3 grid grid-cols-1 gap-2 rounded border border-slate-700 p-2 text-xs text-slate-300">
            <label class="flex items-center justify-between gap-2">
              <span>Auto API call</span>
              <input id="auto-api-toggle" type="checkbox" class="h-4 w-4" />
            </label>
            <label class="flex items-center justify-between gap-2">
              <span>Auto accept API images</span>
              <input id="auto-accept-toggle" type="checkbox" class="h-4 w-4" />
            </label>
            <label class="flex items-center justify-between gap-2">
              <span>Auto export MP4</span>
              <input id="auto-export-toggle" type="checkbox" class="h-4 w-4" />
            </label>
          </div>
          <div id="job-list" class="space-y-2"></div>
          <div id="job-pagination" class="mt-3 flex items-center justify-between gap-2 text-xs text-slate-300"></div>
        </section>

        <section class="panel col-span-12 p-4">
          <h2 class="mb-3 text-lg font-semibold">Logs</h2>
          <div class="mb-2 flex gap-2">
            <select id="log-level" class="inp !w-auto">
              <option value="">all levels</option>
              <option value="success">success</option>
              <option value="info">info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
            <input id="log-module" class="inp" placeholder="module filter (gemini / ffmpeg ...)" />
          </div>
          <div id="log-console" class="h-[180px] overflow-auto rounded-lg border border-slate-700 bg-slate-950 p-2 font-mono text-xs"></div>
        </section>

        <section class="panel col-span-12 p-4">
          <div class="mb-3 flex items-center justify-between gap-2">
            <h2 class="text-lg font-semibold">Live Gallery Slot Preview (12)</h2>
            <div class="flex items-center gap-2">
              <label class="text-xs uppercase text-slate-400">Filter</label>
              <select id="slot-filter" class="inp !w-auto">
                <option value="all">all</option>
                <option value="active">active</option>
                <option value="inactive">inactive</option>
              </select>
            </div>
          </div>
          <div id="group-status" class="mb-2 text-xs text-slate-300"></div>
          <div id="slot-grid" class="grid grid-cols-2 gap-4 xl:grid-cols-4"></div>
        </section>

        <section class="panel col-span-12 p-4">
          <h2 class="mb-3 text-lg font-semibold">Prompt Editor</h2>
          <div class="mb-2 grid grid-cols-3 gap-2">
            <select id="prompt-slot" class="inp">
              <option value="slot01">slot01</option>
              <option value="slot02">slot02</option>
              <option value="slot03">slot03</option>
              <option value="slot04">slot04</option>
              <option value="slot05">slot05</option>
              <option value="slot06">slot06</option>
              <option value="slot07">slot07</option>
              <option value="slot08">slot08</option>
              <option value="slot09">slot09</option>
              <option value="slot10">slot10</option>
              <option value="slot11">slot11</option>
              <option value="slot12">slot12</option>
            </select>
            <button id="load-prompt" class="btn-ghost">Load Slot Prompt</button>
            <button id="save-prompt" class="btn-primary">Save Slot Prompt</button>
          </div>
          <div id="prompt-status" class="mb-2 text-xs text-slate-300"></div>
          <textarea id="prompt-text" class="inp min-h-[120px]"></textarea>
          <div class="mt-3 grid grid-cols-1 gap-2">
            <label class="text-xs uppercase text-slate-400">Global preamble</label>
            <textarea id="preamble-text" class="inp min-h-[100px]"></textarea>
            <button id="save-preamble" class="btn-ghost w-fit">Save Preamble</button>
          </div>
        </section>

        <section class="panel col-span-12 p-4">
          <h2 class="mb-3 text-lg font-semibold">Accepted History</h2>
          <div id="history-list" class="grid grid-cols-1 gap-2 xl:grid-cols-3"></div>
        </section>

      </div>
    </div>

    <div id="config-modal" class="fixed inset-0 z-50 hidden">
      <div id="config-modal-backdrop" class="absolute inset-0 bg-black/70"></div>
      <section class="panel absolute inset-x-4 top-6 mx-auto max-h-[88vh] max-w-[1100px] overflow-auto p-4">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-lg font-semibold">Config</h2>
          <button id="close-config-modal" class="btn-ghost">Close</button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="mb-1 block text-xs uppercase text-slate-400">Incoming selfies folder</label>
            <div class="flex gap-2">
              <input id="incoming-dir" class="inp" />
              <button id="pick-incoming" class="btn-ghost">Browse</button>
            </div>
          </div>
          <div>
            <label class="mb-1 block text-xs uppercase text-slate-400">Outgoing folder</label>
            <div class="flex gap-2">
              <input id="outgoing-dir" class="inp" />
              <button id="pick-outgoing" class="btn-ghost">Browse</button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="mb-1 block text-xs uppercase text-slate-400">Model</label>
              <select id="model-select" class="inp"></select>
              <label class="mt-2 flex items-center justify-between gap-2 rounded border border-slate-700 p-2 text-xs text-slate-300">
                <span>Allow model fallback</span>
                <input id="model-fallback-enabled" type="checkbox" class="h-4 w-4" />
              </label>
            </div>
            <div>
              <label class="mb-1 block text-xs uppercase text-slate-400">API key (write-only)</label>
              <input id="api-key" class="inp" type="password" placeholder="Paste new key to update" />
              <div class="mt-1 flex items-center justify-between gap-2">
                <span id="api-key-status" class="text-[11px] text-slate-400">API key status: unknown</span>
                <button id="clear-api-key" class="btn-ghost !px-2 !py-1 text-[11px]">Clear Key</button>
              </div>
            </div>
          </div>
          <div>
            <label class="mb-1 block text-xs uppercase text-slate-400">Auto Revert To Default (seconds, 0 = off)</label>
            <input id="auto-revert-seconds" class="inp" type="number" min="0" step="1" value="0" />
          </div>
          <button id="save-config" class="btn-primary w-full">Save Config</button>
          <div class="rounded border border-slate-700 p-2">
            <div class="mb-2 flex items-center justify-between gap-2">
              <label class="block text-xs uppercase text-slate-400">Gallery background</label>
              <select id="bg-gallery-select" class="inp !w-auto">
                <option value="gallery1">gallery1</option>
                <option value="gallery2">gallery2</option>
              </select>
            </div>
            <div class="mb-2 text-[11px] text-slate-400" id="bg-current-mode">Current background color</div>
            <div class="mb-2 flex items-center gap-2">
              <div id="bg-current-preview" class="h-6 w-6 rounded border border-slate-500"></div>
              <span id="bg-current-value" class="text-[11px] text-slate-400">#050b17</span>
            </div>
            <div class="mb-2 text-xs text-slate-300">Palette</div>
            <div id="bg-palette" class="mb-2 flex flex-wrap gap-1"></div>
            <div class="mb-2 flex items-center gap-2">
              <input id="bg-color-picker" type="color" class="h-9 w-16 rounded border border-slate-700 bg-slate-900" value="#1174e6" />
              <button id="bg-apply-color" class="btn-ghost !px-2 !py-1 text-xs">Apply Color</button>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <input id="bg-image-file" type="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg" class="inp !w-auto" />
              <button id="bg-apply-image" class="btn-ghost !px-2 !py-1 text-xs">Use Image</button>
            </div>
            <div id="bg-image-name" class="mt-1 text-[11px] text-slate-400">No image selected</div>
          </div>
        </div>
      </section>
    </div>

    <div id="selfie-preview-modal" class="fixed inset-0 z-[60] hidden">
      <div id="selfie-preview-backdrop" class="absolute inset-0 bg-black/85"></div>
      <div class="absolute inset-0 flex items-center justify-center p-4">
        <div class="relative max-h-[88vh] max-w-[88vw] overflow-hidden rounded-lg border border-slate-600 bg-slate-900">
          <button id="selfie-preview-close" class="btn-ghost absolute right-2 top-2 z-10 !px-2 !py-1 text-xs">Close</button>
          <img id="selfie-preview-image" class="block max-h-[88vh] max-w-[88vw] object-contain" alt="Selfie preview" />
        </div>
      </div>
    </div>
    <script src="/js/operatorShared.js"></script>
    <script src="/js/operatorDom.js"></script>
    <script src="/js/operator.render.queue.js"></script>
    <script src="/js/operator.render.slots.js"></script>
    <script src="/js/operator.render.history.js"></script>
    <script src="/js/operatorRender.js"></script>
    <script src="/js/operator.js"></script>
  </body>
</html>
