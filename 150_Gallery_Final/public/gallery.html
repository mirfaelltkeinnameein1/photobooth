<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #stage { position: relative; width: 100%; height: 100%; background: #050b17; }
      .slot {
        position: absolute;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 0;
      }
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .handle {
        position: absolute;
        width: 14px;
        height: 14px;
        right: 2px;
        bottom: 2px;
        background: rgba(240, 180, 41, 0.95);
        border-radius: 3px;
        cursor: nwse-resize;
      }
      .rotate-btn {
        position: absolute;
        top: 4px;
        right: 4px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(5, 11, 23, 0.9);
        color: #f8fafc;
        font-size: 10px;
        line-height: 1;
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
      }
      .slot.dragging { outline: 2px solid #f0b429; }
      .gallery-menu {
        transition: opacity 0.18s ease;
      }
      .gallery-menu-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="layout-menu" class="gallery-menu absolute left-3 top-3 z-10 rounded bg-slate-900/70 p-2 text-xs text-slate-200">
      <div id="gallery-title">Gallery</div>
      <div class="mt-2 flex gap-2">
        <button id="toggle-edit" class="btn-ghost !px-2 !py-1 text-xs">Enable Layout Edit</button>
        <button id="save-layout" class="btn-primary !px-2 !py-1 text-xs">Save Layout</button>
      </div>
    </div>
    <div id="stage"></div>
    <script src="/js/gallery.js"></script>
  </body>
</html>
